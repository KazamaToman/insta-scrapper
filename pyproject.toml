[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instascrapper"
version = "1.0.0"
description = "Scrape public Instagram profiles and download their posts, captions and metadata."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["instagram", "scraper", "downloader", "archive", "osint"]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
instascrapper = "instascrapper.cli:main"

[tool.setuptools.packages.find]
include = ["instascrapper*"]

[tool.setuptools.package-data]
instascrapper = ["web/static/*", "web/static/demo/*"]
